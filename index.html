<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사다리게임</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  label { display: block; margin: 12px 0 4px; font-weight: bold; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; }
  button { margin-top: 12px; padding: 8px 16px; font: inherit; }
  canvas { max-width: 100%; height: auto; margin-top: 16px; }
  #err { color: #c00; }
  li { font-weight: bold; }
</style>
</head>
<body>
<h1>사다리게임</h1>
<label for="names">참가자 (줄바꿈 또는 쉼표로 구분, 2명 이상)</label>
<textarea id="names" rows="4">철수
영희
민수
지은</textarea>
<label for="prizes">결과 항목 (참가자 수와 같아야 함)</label>
<textarea id="prizes" rows="4">당첨
꽝
꽝
꽝</textarea>
<button id="go">사다리 생성</button>
<p id="err" role="alert"></p>
<canvas id="cv" hidden></canvas>
<ol id="out"></ol>
<script src="ladder.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const list = id => $(id).value.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
  const ROWS = 12, GAP = 90, H = 30;

  $('go').onclick = () => {
    const names = list('names'), prizes = list('prizes'), n = names.length;
    $('err').textContent = '';
    if (n < 2) return $('err').textContent = '참가자는 2명 이상이어야 합니다.';
    if (prizes.length !== n) return $('err').textContent = `결과 항목(${prizes.length})이 참가자(${n})와 같아야 합니다.`;

    const ladder = Ladder.generateLadder(n, ROWS);
    const res = Ladder.walk(ladder, n);

    const cv = $('cv'), g = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
    const W = GAP * n, CH = H * (ROWS + 3);
    cv.hidden = false;
    cv.width = W * dpr; cv.height = CH * dpr;
    cv.style.width = W + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const x = c => GAP * c + GAP / 2, y = r => H * (r + 1.5);
    const color = i => `hsl(${(i * 360) / n}, 70%, 45%)`;

    // 참가자별 경로 꼭짓점: 위 -> 각 행의 (세로 이동, 가로 이동) -> 아래
    const pts = names.map((_, s) => {
      const p = Ladder.path(ladder, n, s);
      const v = [[x(s), y(0) - 10]];
      p.slice(0, -1).forEach((c, r) => v.push([x(c), y(r)], [x(p[r + 1]), y(r)]));
      v.push([x(p[ROWS]), y(ROWS - 1) + 10]);
      return v;
    });
    const lens = pts.map(v => v.map((q, k) => k ? Math.hypot(q[0] - v[k - 1][0], q[1] - v[k - 1][1]) : 0));

    // t: 0..1 진행도. 모든 참가자가 같은 비율로 동시에 내려온다.
    const draw = (t, done) => {
      g.clearRect(0, 0, W, CH);
      g.textAlign = 'center'; g.lineCap = 'round';
      g.strokeStyle = '#bbb'; g.lineWidth = 3; g.fillStyle = '#000'; g.font = '14px sans-serif';
      for (let c = 0; c < n; c++) {
        g.beginPath(); g.moveTo(x(c), y(0) - 10); g.lineTo(x(c), y(ROWS - 1) + 10); g.stroke();
        g.fillText(names[c], x(c), 18);
      }
      ladder.forEach((row, r) => row.forEach(c => {
        g.beginPath(); g.moveTo(x(c), y(r)); g.lineTo(x(c + 1), y(r)); g.stroke();
      }));
      pts.forEach((v, i) => {
        let left = t * lens[i].reduce((a, b) => a + b, 0), end = v[0];
        g.strokeStyle = g.fillStyle = color(i); g.lineWidth = 5;
        g.beginPath(); g.moveTo(...v[0]);
        for (let k = 1; k < v.length && left > 0; k++) {
          const f = Math.min(1, left / (lens[i][k] || 1));
          end = [v[k - 1][0] + (v[k][0] - v[k - 1][0]) * f, v[k - 1][1] + (v[k][1] - v[k - 1][1]) * f];
          g.lineTo(...end); left -= lens[i][k];
        }
        g.stroke();
        g.beginPath(); g.arc(end[0], end[1], 7, 0, 2 * Math.PI); g.fill();
      });
      prizes.forEach((pz, c) => {
        g.font = done ? 'bold 14px sans-serif' : '14px sans-serif';
        g.fillStyle = done ? color(res.indexOf(c)) : '#000';
        g.fillText(pz, x(c), CH - 8);
      });
    };

    $('out').innerHTML = '';
    $('go').disabled = true;
    const t0 = performance.now(), DUR = 4000;
    const step = now => {
      const t = Math.min(1, (now - t0) / DUR);
      draw(t, t === 1);
      if (t < 1) return requestAnimationFrame(step);
      names.forEach((nm, i) => {
        const li = document.createElement('li');
        li.textContent = `${nm} → ${prizes[res[i]]}`;
        li.style.color = color(i);
        $('out').append(li);
      });
      $('go').disabled = false;
    };
    requestAnimationFrame(step);
  };
</script>
</body>
</html>
